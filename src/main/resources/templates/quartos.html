<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de quartos</title>
</head>
<body>

<h1>Lista de quartos</h1>
<br><br>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Número</th>
        <th>Andar</th>
        <th>Tipo de quarto</th>
        <th>Status do quarto</th>
        <th>Valor da diária</th>
        <th>Detalhes</th>
        <th>Alterar status</th>
    </tr>
    <tr th:each="item : ${quartos}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.numero}"></td>
        <td th:text="${item.andar}"></td>
        <td th:text="${item.tipoQuarto}"></td>
        <td th:text="${item.statusQuarto}"></td>
        <td th:text="${item.valorDiaria}"></td>
        <td><a th:href="@{/quartos/{id}(id=${item.id})}">Abrir</a></td>
        <td>


            <form th:if="${item.statusQuarto.name() == 'LIVRE'}" th:action="@{/quartos/{id}/ocupar(id=${item.id})}" method="post" style="display: inline">
                <button type="submit">Ocupar</button>
            </form>
            <form th:if="${item.statusQuarto.name() == 'OCUPADO'}" th:action="@{/quartos/{id}/liberar(id=${item.id})}" method="post" style="display: inline">
                <button type="submit">Liberar</button>
            </form>
            <form th:if="${item.statusQuarto.name() == 'LIVRE'}" th:action="@{/quartos/{id}/enviarManutencao(id=${item.id})}" method="post" style="display: inline">
                <button type="submit">Enviar para manutenção</button>
            </form>
        </td>
    </tr>
</table>
<br>
<a th:href="@{/quartos/novo}">Adicionar novo</a>

</body>
</html>
